<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Equipamento</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Adicionar Novo Equipamento</h1>
        <nav>
            <a href="index.html" class="btn">Voltar para a Lista</a>
        </nav>

        <form id="form-item">
            <div class="form-group">
                <label for="nome">Nome do Item:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label for="marca">Marca:</label>
                <input type="text" id="marca" required>
            </div>
            <div class="form-group">
                <label for="status">Status de Compra:</label>
                <input type="text" id="status" required>
            </div>
            <button type="submit" class="btn-submit">Salvar Item</button>
        </form>
    </div>

    <!-- 1. Carrega o SDK do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Carrega a conexão -->
    <script src="./js/supabaseClient.js"></script>
    <!-- 3. Carrega a lógica da página -->
    <script src="./js/app.js"></script>
    
</body>
</html>
